[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-spend-auditor"
dynamic = ["version"]
description = "Read-only, local-first audit of Splunk ingest cost vs. real usage."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
splunk-spend-auditor = "splunk_spend_auditor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "splunk_spend_auditor.__version__"}

# Fase 5B: recursos de runtime empaquetados dentro del paquete.
[tool.setuptools.package-data]
splunk_spend_auditor = ["templates/*.j2", "queries/*.spl"]
