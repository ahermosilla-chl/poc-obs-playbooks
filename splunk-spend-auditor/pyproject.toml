[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-spend-auditor"
version = "0.1.0"
description = "Read-only, local-first audit of Splunk ingest cost vs. real usage."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pandas>=2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
splunk-spend-auditor = "splunk_spend_auditor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
