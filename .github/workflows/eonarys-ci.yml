name: EONARYS CI

on:
  push:
    branches: [main]
    paths:
      - "eonarys/**"
      - ".github/workflows/eonarys-ci.yml"
  pull_request:
    paths:
      - "eonarys/**"
      - ".github/workflows/eonarys-ci.yml"

defaults:
  run:
    working-directory: eonarys

concurrency:
  group: eonarys-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: eonarys/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Audit dependencies
        run: pnpm audit --audit-level=critical
        continue-on-error: true
