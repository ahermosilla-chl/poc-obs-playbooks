# Fase 5B.1: builds nativos del ejecutable standalone (PyInstaller NO
# cross-compila). Solo manual: no corre en commits normales. NO crea
# releases, NO publica en ningún lado -- solo artifacts internos de Actions.
# Sin secretos: no usa credenciales de firma, Apple ni Windows.
name: release-build

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: splunk-spend-auditor
    shell: bash

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 a propósito: glibc más antigua = binario compatible
          # con más distribuciones (sin prometer compatibilidad universal).
          - target: linux-x86_64
            runner: ubuntu-22.04
            expected_machine: x86_64
          - target: windows-x86_64
            runner: windows-2022
            expected_machine: AMD64
          # macos-14 es Apple Silicon (arm64); el job verifica la arquitectura
          # real y falla si el runner no es arm64.
          - target: macos-arm64
            runner: macos-14
            expected_machine: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner architecture
        run: |
          python - <<'PY'
          import platform, sys
          print("system:", platform.system(), "machine:", platform.machine())
          assert platform.machine() == "${{ matrix.expected_machine }}", (
              f"runner is {platform.machine()}, expected ${{ matrix.expected_machine }}"
          )
          PY

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test suite
        run: python -m pytest tests -q -rf 2>&1 | tee pytest.log; exit "${PIPESTATUS[0]}"

      - name: Surface failed tests as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)" pytest.log | head -20 | while read -r line; do echo "::error::${line}"; done

      - name: Build standalone executable
        run: python scripts/build.py

      - name: Resolve artifact name
        id: art
        run: |
          NAME=$(python scripts/build.py --print-artifact-name)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          case "$NAME" in
            *"${{ matrix.target }}"*) ;;
            *) echo "artifact $NAME does not match target ${{ matrix.target }}"; exit 1 ;;
          esac

      - name: Smoke test packaged executable (outside the repository)
        run: python scripts/smoke_test.py "dist/${{ steps.art.outputs.name }}"

      - name: Show binary architecture
        if: runner.os != 'Windows'
        run: file "dist/${{ steps.art.outputs.name }}"

      - name: Offline demo (no network namespace) - Linux only
        if: runner.os == 'Linux'
        run: |
          # Best effort: el demo no debe necesitar red. Root dentro de un netns vacío.
          sudo unshare -n -- "$PWD/dist/${{ steps.art.outputs.name }}" demo --output-dir "$RUNNER_TEMP/offline-demo" | tee "$RUNNER_TEMP/offline.txt"
          grep -q "Daily ingest:          267.2 GB/day" "$RUNNER_TEMP/offline.txt"

      - name: Record checksum and size
        run: |
          cat "dist/${{ steps.art.outputs.name }}.sha256"
          python -c "import os; print(os.path.getsize('dist/${{ steps.art.outputs.name }}'), 'bytes')"

      - name: Annotate artifact facts (name, arch, size, SHA-256)
        run: |
          NAME="${{ steps.art.outputs.name }}"
          SHA=$(cut -d' ' -f1 "dist/$NAME.sha256")
          SIZE=$(python -c "import os; print(os.path.getsize('dist/$NAME'))")
          ARCH=$(python -c "import platform; print(platform.machine())")
          if [ "$RUNNER_OS" != "Windows" ]; then FILEINFO=$(file -b "dist/$NAME"); else FILEINFO="PE executable (runner machine $ARCH)"; fi
          MSG="$NAME | runner arch: $ARCH | $FILEINFO | $SIZE bytes | sha256 $SHA"
          echo "::notice title=artifact::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: |
            splunk-spend-auditor/dist/${{ steps.art.outputs.name }}
            splunk-spend-auditor/dist/${{ steps.art.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 14
