services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eonarys
      POSTGRES_PASSWORD: eonarys
      POSTGRES_DB: eonarys_dev
    ports:
      - '5432:5432'
    volumes:
      - eonarys-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eonarys -d eonarys_dev']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  eonarys-postgres-data:
